# .deb for the Skim desktop app; built by packaging/linux/Dockerfile.
name: skim
arch: ${ARCH}
version: ${VERSION}
maintainer: Skim
description: Local-first pull-request review workspace.
section: devel
priority: optional
depends:
  - libgtk-3-0t64 | libgtk-3-0
  - libwebkit2gtk-4.1-0
recommends:
  - git
  - xdg-utils
contents:
  - src: cmd/skim-desktop/build/bin/Skim
    dst: /usr/bin/skim-desktop
  - src: packaging/linux/skim.desktop
    dst: /usr/share/applications/skim.desktop
  - src: cmd/skim-desktop/build/appicon.png
    dst: /usr/share/icons/hicolor/1024x1024/apps/skim.png
