name: Release

# Push a tag like v0.1.0 to build the universal macOS DMG (signed and notarized
# when the secrets below are configured) and attach it to a GitHub Release with
# checksums. Tag builds stamp the tag (minus the leading "v") into
# info.productVersion in cmd/skim-desktop/wails.json before packaging, so the
# DMG name and the app's bundle version always match the tag.
#
# Run it manually (workflow_dispatch) to exercise the exact sign/notarize/staple
# pipeline against the configured secrets WITHOUT cutting a release: the build
# job uploads its artifact, but the publish job is tag-gated.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS (universal)
    runs-on: macos-15
    # Secrets can't be referenced directly in a step `if:`, so surface them as
    # env vars and gate the credential steps on those. When the secrets are
    # absent the import step is skipped and packaging/macos/package.sh falls
    # back to an unsigned build — so tag builds never hard-fail on missing creds.
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
      NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Go 1.27 sets the macOS 13 floor in the Makefile and Info.plist.
          go-version: "1.27.x"
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      - name: Import signing certificate
        if: ${{ env.MACOS_CERTIFICATE != '' }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/skim-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm -f "$CERT_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          CONFIG=cmd/skim-desktop/wails.json
          jq --arg v "${GITHUB_REF_NAME#v}" '.info.productVersion = $v' "$CONFIG" > "$RUNNER_TEMP/wails.json"
          mv "$RUNNER_TEMP/wails.json" "$CONFIG"
      - name: Package (build, DMG; sign + notarize when secrets are present)
        run: make package-macos
      - name: Clean up signing keychain
        if: ${{ always() }}
        run: '[ -n "${KEYCHAIN_PATH:-}" ] && security delete-keychain "$KEYCHAIN_PATH" || true'
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: bin/Skim-*.dmg
          if-no-files-found: error

  release:
    name: Publish release
    needs: [macos]
    # Only real tag pushes publish a Release; manual credentials-test runs stop
    # after the build job uploads its artifact.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          sha256sum -- * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            ### Install

            **macOS 13+** — open `Skim-*.dmg` and drag Skim into Applications
            (universal: Apple silicon and Intel). The app is signed and normally
            notarized — if Gatekeeper objects on first launch, right-click → Open once.

            Checksums are in `SHA256SUMS.txt`.
